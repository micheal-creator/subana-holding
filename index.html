<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Subana Holding builds practical companies, products and partnerships for a stronger future." />
    <title>Subana Holding | Building what matters</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      #app-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #ffffff; z-index: 9999;
      }
      #app-splash img { width: 92px; height: 92px; animation: splash-pulse 1.4s ease-in-out infinite; }
      #app-splash .bar { width: 120px; height: 4px; border-radius: 999px; background: #e5eaf0; overflow: hidden; }
      #app-splash .bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: 999px; background: #1Fab3f; animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .65; transform: scale(.94); } }
      @keyframes splash-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #app-splash img, #app-splash .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img src="./subana-logo.png" alt="Subana Holding" />
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
